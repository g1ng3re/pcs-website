y - full / half / SSP / nothing`,bold:!0},{id:`ff5`,text:`Mortgage outstanding + remaining term`},{id:`ff6`,text:`Total essential monthly outgoings`},{id:`ff7`,text:`Savings - amount and accessibility`},{id:`ff8`,text:`Existing cover anywhere`},{id:`ff9`,text:`Smoker in last 12 months`},{id:`ff10`,text:`Medical history covered`},{id:`ff11`,text:`Mental health - asked directly`,bold:!0},{id:`ff12`,text:`Height and weight`}]},{id:`abcdef`,title:`ABCDEF`,icon:``,note:`Lead with consequences, never products. Use their numbers. Let the client do the maths out loud.`,scripts:[{label:`A - Anchor income`,text:`"When you applied for your mortgage, what was the one thing the lender cared most about? Your income is the engine - the [£X] you bring home is what pays the mortgage, covers the kids, runs the car. Everything comes down to one question: what happens if the engine stops?"`},{label:`B - Ordinary illness`,text:`"Say you wake up tomorrow and your back has gone. Doctor signs you off for three months. Full sick pay runs for [X weeks]. After that - Statutory Sick Pay, around £118 a week. Outgoings are still [£X] every month. How long do savings cover that gap?"`},{label:`C - Serious diagnosis`,text:`"Same person, off work - but this time a diagnosis. Months, not weeks. The income gap runs far longer. Plus costs nobody plans for: appointments, a partner cutting hours. Not replacing your wage month by month - a single sum that takes the financial worry off the table."`},{label:`D - Death`,text:`"If something happened to you tomorrow, that [£X] mortgage does not go anywhere. [Partner] is left on [£X] with [dependants]. Right now - is there enough to clear the house and give them room to breathe?"`},{label:`D - No dependants`,text:`"You do not have dependants relying on your income, so this is less urgent. Being honest about that - it changes the priority order."`},{label:`F - Summary and priority question`,text:`"[Summarise all three risks on their actual numbers.]

Put those three risks in order. Income risk, serious illness, death. Most important to least - and tell me why."`},{label:`F - If death first, push back`,text:`"The instinct to protect the family is right - but your sick pay runs out in [X weeks] and savings last [X months]. Off for 6 months? Your family is in the same position as if you died - mortgage does not get paid either way. Same outcome, far more probable route. Does that change the order?"`}],items:[{id:`a1`,text:`A - Income anchored using the mortgage`,bold:!0},{id:`b1`,text:`B - Client did the maths out loud on the gap`},{id:`c1`,text:`C - Framed as lump sum, not income replacement`},{id:`d1`,text:`D - No dependants? Honest about lower priority`},{id:`f1`,text:`Priority order agreed and recorded`,bold:!0}]},{id:`budget`,title:`Budget`,icon:``,compliance:!0,complianceNote:`Confirmed budget must be recorded in file.`,note:`Work from household disposable income. Never suggest a number - let them name it.`,scripts:[{label:`The rule`,text:`Never say a number first. Use comfortable, not budget - budget signals a cap, comfortable signals a decision. Ask, then stop talking. The first person to speak loses.`},{label:`The question`,text:`"Based on everything you have told me - if we put something in place that covers your most important risk properly - what monthly figure would feel comfortable?"

ty 3] is noted - we come back to it. This is the sensible starting point."`},{label:`Option B`,text:`"Option B shows full coverage - all three risks. [£X] a month. Sometimes the gap between A and B is smaller than people expect."`}],items:[{id:`il1`,text:`Option A presented - within budget`},{id:`il2`,text:`Option B presented - full stack`},{id:`il3`,text:`Choice recorded in file`}]},{id:`rec`,title:`Recommendation`,icon:``,compliance:!0,complianceNote:`All three needs documented. Deferred needs recorded as outstanding in suitability letter.`,scripts:[{label:`Link back to the scenario`,text:`"Do you remember the [bad back / diagnosis / death] scenario we walked through last week? This is the policy that closes that gap."`},{label:`Explaining IP`,text:`"Income protection pays a monthly income if you cannot work - not just named conditions, anything that stops you working. Deferred period is [X weeks] - lines up exactly with when your sick pay stops."`},{label:`Level vs decreasing life`,text:`"I am recommending level term. Decreasing tracks the mortgage down and is cheaper - level keeps the sum fixed. With [dependants], the surplus above the mortgage matters."`},{label:`Explaining CI`,text:`"Critical illness pays a lump sum if diagnosed with a listed condition at a specific severity. I will send the Key Facts document."`}],items:[{id:`r1`,text:`Each policy linked to its scenario from M1`,bold:!0},{id:`r2`,text:`Cost per policy and combined total shown`},{id:`r3`,text:`Deferred need noted in suitability letter`}]},{id:`objections`,title:`Objections`,icon:``,note:`Every objection is a question in disguise. Probe first - never argue.`,scripts:[{label:`"I need to think about it"`,text:`"Absolutely - I want you to be sure. Can I ask, what is it specifically that you are not sure about? Is it the cost, the type of cover, or just whether now is the right time? [Address that specific thing.]"`},{label:`"It’s too expensive"`,text:`"I hear you. Too expensive compared to what? W
