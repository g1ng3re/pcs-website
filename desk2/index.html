<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0C1A3A" />
  <meta name="robots" content="noindex" />
  <title>The desk has moved</title>
  <!-- Belt and braces. The server sends a 301 for anything under /desk2/, so
       this page is only reached by a browser or an installed iPad app that is
       answering the request from its own cache and never asked the server. That
       is exactly the case the script below is here to unpick. -->
  <link rel="canonical" href="https://propertyclinicsolutions.com/desk/" />
  <style>
    :root { color-scheme: light }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:#E8EDF9; color:#0C1A3A;
           font:400 15px/1.6 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,system-ui,sans-serif }
    .card { max-width:420px; padding:34px 30px; background:#fff; border-radius:14px;
            box-shadow:0 2px 8px rgba(12,26,58,.10),0 20px 44px rgba(12,26,58,.16); text-align:left }
    h1 { font:700 20px/1.3 Archivo,sans-serif; margin:0 0 10px }
    p { margin:0 0 16px; color:#3B4560 }
    a { display:inline-block; padding:10px 16px; border-radius:7px; background:#1B44C8;
        color:#fff; text-decoration:none; font-weight:600 }
    small { display:block; margin-top:18px; color:#6B7489; font-size:12px }
  </style>
</head>
<body>
  <div class="card">
    <h1>The desk has moved</h1>
    <p>It now lives at <b>propertyclinicsolutions.com/desk</b>. Taking you there.</p>
    <a href="https://propertyclinicsolutions.com/desk/">Open the desk</a>
    <small>
      If you added the old address to your home screen, remove that icon and add the new one once.
      Everything on your book is untouched: it is the same account and the same data.
    </small>
  </div>

  <script>
    /* An installed copy is the reason this page exists.
     *
     * The old desk registered a service worker, and a service worker answers
     * navigations from its own cache without the request ever reaching the
     * server. So a 301 in .htaccess does nothing for the one person who has the
     * old app on their home screen, which is the person who matters. This tears
     * the old worker down and empties its caches before leaving, so the old
     * address cannot serve a stale desk to anybody ever again. */
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) { /* nothing cached, nothing to clear */ }
      location.replace('https://propertyclinicsolutions.com/desk/');
    })();
  </script>
</body>
</html>
