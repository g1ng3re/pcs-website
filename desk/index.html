<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0C1A3A" />
  <meta name="robots" content="noindex" />
  <title>The desk has been retired</title>
  <style>
    :root { color-scheme: light }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:#E8EDF9; color:#0C1A3A;
           font:400 15px/1.6 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,system-ui,sans-serif }
    .card { max-width:420px; padding:34px 30px; background:#fff; border-radius:14px;
            box-shadow:0 2px 8px rgba(12,26,58,.10),0 20px 44px rgba(12,26,58,.16); text-align:left }
    h1 { font:700 20px/1.3 Archivo,sans-serif; margin:0 0 10px }
    p { margin:0 0 16px; color:#3B4560 }
    a { color:#1B44C8; font-weight:600 }
    small { display:block; margin-top:18px; color:#6B7489; font-size:12px }
  </style>
</head>
<body>
  <div class="card">
    <h1>The desk has been retired</h1>
    <p>Meeting preparation no longer runs here. Client records live in Smartr365.</p>
    <p>If this was on your home screen, you can remove it. Nothing is stored on this page.</p>
    <p><a href="/">Go to propertyclinicsolutions.com</a></p>
    <small>Property Clinic Solutions Ltd &middot; FRN 816566</small>
  </div>
  <script>
    // Uninstall anything the old app left behind on this device.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(rs => Promise.all(rs.map(r => r.unregister())))
        .catch(() => {});
    }
    if (window.caches) {
      caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).catch(() => {});
    }
    try { localStorage.clear(); } catch (e) {}
  </script>
</body>
</html>
