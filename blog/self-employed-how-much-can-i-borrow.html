      <div className="art-hero">
        <div className="art-hero-i">
          <a href="../blog" style={{font:"700 12px var(--font-sans)",color:"rgba(255,255,255,.4)",textDecoration:"none",display:"inline-block",marginBottom:16}}>&larr; Blog</a>
          <div><span className="art-cat">Mortgages</span></div>
          <h1 style={{font:"900 clamp(28px,4vw,44px)/1.1 var(--font-display)",color:"#fff",letterSpacing:"-.02em",margin:"14px 0 0"}}>How much can you borrow when you are self-employed?</h1>
          <div style={{font:"500 13px var(--font-sans)",color:"rgba(255,255,255,.4)",marginTop:14,display:"flex",gap:16}}><span>6 min read</span><span>Mortgages</span></div>
        </div>
      </div>
      <article className="art-body" id="main">
        <p>It is the first question everyone asks, and the honest answer is that a single multiple of your income will not give it to you.</p>
        <p>Two self-employed applicants declaring the same profit can be offered very different amounts. The difference is rarely the income. It is everything sitting around it.</p>

        <h2>Income multiples are a starting point, not the answer</h2>
        <p>You will see rules of thumb quoted everywhere, usually somewhere between four and five times income. They are a rough indication only. The exact multiple a lender will stretch to depends on the lender, your income level, your deposit and your wider profile, and it can be lower as easily as higher.</p>
        <p>More importantly, the multiple is a ceiling rather than a promise. Clearing it does not mean you will be lent that amount. The real test comes next.</p>

        <h2>Affordability is the real test</h2>
        <p>Lenders model your actual monthly position. Income after tax, credit commitments, dependants, childcare, essential outgoings, and in some cases your spending patterns from bank statements.</p>
        <p>They then stress test the payment against a higher interest rate than the one you are applying for, to check you could still afford it if rates moved. That stress rate does more to shape the final number than the headline multiple does.</p>

        <h2>Which income figure counts</h2>
        <p>Before any of this, the lender has to decide what your income actually is, and that depends entirely on how your business is structured. Sole traders are assessed on net profit. Most lenders assess limited company directors on salary plus dividends drawn, while a minority will also consider profit retained in the company.</p>
        <p>That choice can change the assessable figure dramatically. We set out how each structure is treated in <a href="self-employed-income-explained" style={{color:"var(--pcs-blue)",fontWeight:600}}>how lenders work out your self-employed income</a>, and it is worth reading before you go any further.</p>

        <h2>What pulls the number down</h2>
        <ul>
          <li>Credit commitments. Car finance, personal loans, credit card balances and buy now pay later agreements all reduce affordability, sometimes more than people expect.</li>
          <li>Dependants and childcare. Lenders apply their own assumed costs per child.</li>
          <li>Business borrowing. Outstanding business loans and an overdrawn director's loan account both get taken into account.</li>
          <li>Falling income. If the latest year is down on the year before, most lenders will work from the lower figure and ask why.</li>
        </ul>

        <h2>What pushes it up</h2>
        <ul>
          <li>A larger deposit. It lowers the loan to value, which widens the lender choice and usually improves the rate.</li>
          <li>A clean credit file with no recent missed payments.</li>
          <li>Three years of stable or rising accounts rather than the minimum two.</li>
          <li>The right lender for your structure, which is the single biggest variable in this part of the market.</li>
        </ul>

        <h2>What if you only have one year of accounts</h2>
        <p>It is possible with some lenders, but the field is much smaller. It usually helps to have a meaningful deposit and a clear employment history in the same line of work before you went self-employed.</p>
        <p>Contractors are often a different case entirely. Many lenders will assess a contractor on their day rate rather than on filed accounts, which can produce a far more generous figure and needs far less trading history. If you contract, do not let anyone assess you as a standard sole trader without checking that route first.</p>

        <h2>Get an agreement in principle before you view anything</h2>
        <p>An agreement in principle is a lender's initial indication of what they may lend, based on the information you give and an initial credit check, usually a soft search that does not affect your credit file.</p>
        <p>It is not a guarantee and it is not a mortgage offer. What it does is give you a realistic range to search in and give estate agents confidence that your offer is serious. For a self-employed buyer, that second point matters more than most people realise.</p>

        <h2>The short version</h2>
        <p>Work out which income figure applies to your structure, get your last two years of documents in order, understand what your commitments are doing to your affordability, and get an agreement in principle from a lender that actually suits your case rather than the first one you find.</p>
