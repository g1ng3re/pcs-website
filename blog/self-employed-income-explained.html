function Article() {
  return (
    <React.Fragment>
      <div className="art-hero">
        <div className="art-hero-i">
          <a href="../blog" style={{font:"700 12px var(--font-sans)",color:"rgba(255,255,255,.4)",textDecoration:"none",display:"inline-block",marginBottom:16}}>&larr; Blog</a>
          <div><span className="art-cat">Mortgages</span></div>
          <h1 style={{font:"900 clamp(28px,4vw,44px)/1.1 var(--font-display)",color:"#fff",letterSpacing:"-.02em",margin:"14px 0 0"}}>Sole trader or limited company: how lenders work out your self-employed income</h1>
          <div style={{font:"500 13px var(--font-sans)",color:"rgba(255,255,255,.4)",marginTop:14,display:"flex",gap:16}}><span>7 min read</span><span>Mortgages</span></div>
        </div>
      </div>
      <article className="art-body" id="main">
        <p>The most common surprise in a self-employed mortgage conversation is the income figure. A business turning over £150,000 does not give you an income of £150,000 in a lender's eyes. Very often the figure they use is less than half what the client expected.</p>
        <p>This is not lenders being awkward. Each business structure produces a different verifiable number, and lenders have settled on which one they trust. Knowing which number applies to you before you apply changes the whole conversation.</p>
        <p>If you would rather talk it through than read it, see how we handle <a href="../self-employed" style={{color:"var(--pcs-blue)",fontWeight:600}}>self-employed mortgage cases</a>.</p>

        <h2>If you are a sole trader</h2>
        <p>Lenders use your net profit. That is the figure left after allowable business expenses and before tax. Not turnover.</p>
        <p>So a sole trader with £120,000 of turnover and £70,000 of expenses has an income of £50,000 for mortgage purposes. The £120,000 is not relevant to the calculation, however hard it was to earn.</p>
        <p>Evidence is usually your SA302 tax calculation and the matching tax year overview from HMRC, typically for the last two years. Some lenders will take a certificate from a qualified accountant instead.</p>

        <h2>If you are in a partnership</h2>
        <p>Your share of the net profit, as set out in the partnership agreement and declared on your own tax return. The partnership's total profit is not your income. Your share of it is.</p>

        <h2>If you are a limited company director</h2>
        <p>This is where lenders differ most, and where the choice of lender does the most work.</p>
        <p>Most lenders take your salary plus the dividends you have actually drawn. That is the standard approach and it is what a high street application will usually assume.</p>
        <p>A smaller number of lenders will take your salary plus your share of the company's net profit after corporation tax, whether or not you drew it. If you leave profit in the business, which most sensible directors do, the difference is substantial.</p>
        <p>Take a director on a £12,570 salary, £25,000 of dividends, and £60,000 of profit retained in the company. On the first approach the assessable income is around £37,570. On the second it could be closer to £97,000. Same business, same year, same person, and a completely different borrowing figure.</p>
        <div className="art-tip"><strong>If you retain profit in your company, say so before anyone runs an application.</strong> It determines which lenders should be approached first, and approaching them in the wrong order can mean an unnecessary credit search and a decline that tells you nothing.</div>
        <p>Lenders that use retained profit are a minority and their criteria vary on how much they will count, how many years they want and what the accountant must confirm. Availability depends on the lender and your circumstances.</p>

        <h2>Which years they use</h2>
        <p>Most lenders want two years of trading history. Some will consider one year if the rest of the application is strong. Three years opens more doors than two.</p>
        <p>What they do with those years also varies:</p>
        <ul>
          <li>Many average the most recent two years.</li>
          <li>Some use the latest year only.</li>
          <li>Some use the lower of the latest year or the two-year average.</li>
        </ul>
        <p>The direction of travel matters. If your income is rising, an averaging lender holds you back and a latest-year lender helps you. If it has fallen, most lenders will work from the lower figure and will want to understand why.</p>

        <h2>The tax efficiency trap</h2>
        <p>A good accountant reduces your taxable profit. A mortgage lender reads that reduced profit as your income. The two objectives pull in opposite directions and nobody usually points this out until it is too late.</p>
        <p>Two or three years of aggressive expense claims immediately before a purchase can cost you more in borrowing capacity than they saved you in tax. That is not an argument for paying more tax than you owe. It is an argument for having the conversation early.</p>
        <p>If a purchase is anywhere on the horizon in the next two or three years, your accountant and your broker should be told at the same time.</p>

        <h2>What you will need</h2>
        <ul className="chk">
          <li>Two years of SA302 tax calculations and tax year overviews, or an accountant's certificate</li>
          <li>Two years of full business accounts if you trade through a limited company</li>
          <li>Three months of personal bank statements, and often business statements too</li>
          <li>Proof of your deposit and where it came from</li>
          <li>Details of any business or personal borrowing, including director's loan accounts</li>
        </ul>

        <h2>Where this leaves you</h2>
        <p>Being self-employed is not a barrier to a mortgage. Being unprepared is.</p>
        <p>Criteria vary more in this part of the market than almost anywhere else, and that cuts both ways. A decline from one lender tells you very little about what the rest would do, provided the next application goes somewhere that actually fits your structure.</p>
        <p>The next question is usually how much all of this adds up to. We cover that in <a href="self-employed-how-much-can-i-borrow" style={{color:"var(--pcs-blue)",fontWeight:600}}>how much you can borrow when you are self-employed</a>.</p>
      </article>
      <div className="art-cta-band">
        <h3>Not sure which figure applies to you?</h3>
        <p>We work with sole traders, contractors and limited company directors, and we research which lenders suit your income structure before anything is submitted.</p>
        <a href="../self-employed">See how we help self-employed applicants &rarr;</a>
      </div>

      </div>
    </React.Fragment>
  );
}
