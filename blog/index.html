  .pcs-bcard, .pcs-bcard:hover, .pcs-bcard:focus,

  .pcs-bcard__body { padding: 28px; flex: 1; display: flex; flex-direction: column; }

  .pcs-bcard__title { font: 700 21px/1.28 var(--font-display); color: var(--pcs-ink); letter-spacing: -.01em; margin: 0 0 10px; }

  .pcs-bcard__read { color: var(--pcs-blue); font: 700 14px var(--font-sans); display: inline-flex; align-items: center; gap: 6px; }

  .pcs-bcard--feature { grid-column: 1 / -1; flex-direction: row; }
  .pcs-bcard--feature .pcs-bcard__bar { height: auto; width: 6px; }
